<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>BreadNet - Restablecer Contraseña</title>
	<link rel="icon" type="image/x-icon" href="/assets/breadnet_small.webp">
	<link rel="stylesheet" href="styles.css">
	<link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
	<link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>
	<link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
	<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
	<style>
		body {
			display: flex;
			flex-direction: column;
			align-items: center;		
			padding-top: 12px;
			box-sizing: border-box;	
		}
		div {
			width: 100%;
			display: flex;
			flex-direction: column;
			align-items: center;	
		}
		i {
			font-size: 18px;
			width: 18px;
			height: 18px;
		}
		#reset-status {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
		}
		img {
			width: 200px;
			height: 100px;
			object-fit: contain;
		}
	</style>
</head>
<body>
	<div id="login-section">
		<img src="/assets/breadnet_d.png" alt="BreadNet Logo">
		<h2>Restablecer Contraseña</h2>
		<p id="reset-status"><i class="fi fi-rr-loading"></i> Verificando enlace...</p>
		<input type="password" id="new-password" placeholder="Nueva contraseña" class="hidden">
		<input type="password" id="new-password-confirm" placeholder="Confirmar contraseña" class="hidden">
		<button id="btn-reset-confirm" class="hidden">Cambiar Contraseña</button>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script>
		const SUPABASE_URL = "https://ogdnjfmeouevtybmuquq.supabase.co";
		const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nZG5qZm1lb3VldnR5Ym11cXVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMTExOTksImV4cCI6MjEwMzc4NzE5OX0.Vz_M2mf2qgZX-aWwHnQy0DI59EQJCDtYpl3aBt3TFtM";
		const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

		let recoverySessionReady = false;

		supabaseClient.auth.onAuthStateChange((event, session) => {
			if (event === "PASSWORD_RECOVERY") {
				recoverySessionReady = true;
				document.getElementById('reset-status').innerHTML = `<i class="fi fi-rr-key"></i> Ingresa tu nueva contraseña:`;
				document.getElementById('new-password').classList.remove('hidden');
				document.getElementById('new-password-confirm').classList.remove('hidden');
				document.getElementById('btn-reset-confirm').classList.remove('hidden');
			}
		});

		setTimeout(() => {
			if (!recoverySessionReady) {
				document.getElementById('reset-status').innerHTML = `<i class="fi fi-rr-triangle-warning"></i> El enlace es inválido o ha expirado. Solicita uno nuevo desde la pantalla de inicio de sesión.<br><a href="/breadnet/index.html">Volver al inicio</a>`;
			}
		}, 3000);

		document.getElementById('btn-reset-confirm').addEventListener('click', async () => {
			const pass1 = document.getElementById('new-password').value;
			const pass2 = document.getElementById('new-password-confirm').value;

			if (!pass1 || pass1.length < 6) {
				document.getElementById('reset-status').innerHTML = `<i class="fi fi-rr-triangle-warning"></i> La contraseña debe tener al menos 6 caracteres.`;
				return;
			}
			if (pass1 !== pass2) {
				document.getElementById('reset-status').innerHTML = `<i class="fi fi-rr-triangle-warning"></i> Las contraseñas no coinciden.`;
				return;
			}

			document.getElementById('btn-reset-confirm').disabled = true;
			const { error } = await supabaseClient.auth.updateUser({ password: pass1 });

			if (error) {
				document.getElementById('reset-status').innerHTML = `<i class="fi fi-sr-octagon-xmark"></i> Error: ${error.message}`;
				document.getElementById('btn-reset-confirm').disabled = false;
			} else {
				document.getElementById('reset-status').innerHTML = `<i class="fi fi-br-check"></i> Contraseña actualizada! Ya puedes iniciar sesión normalmente.`;
				document.getElementById('new-password').classList.add('hidden');
				document.getElementById('new-password-confirm').classList.add('hidden');
				document.getElementById('btn-reset-confirm').classList.add('hidden');
				setTimeout(() => { window.location.href = '/index.html'; }, 2500);
			}
		});
	</script>
</body>
</html>
